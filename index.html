<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Equipo — Tivenos Group</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F0EC;
  --surface: #FFFFFF;
  --surface2: #F8F7F4;
  --border: rgba(0,0,0,0.07);
  --border-strong: rgba(0,0,0,0.13);
  --text: #1A1916;
  --text-muted: #6B6960;
  --text-faint: #A8A59C;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.09);
  --font: 'DM Sans',sans-serif;
  --mono: 'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:#7F77DD}
.period-badge{font-size:11px;font-weight:500;color:var(--text-muted);background:var(--bg);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.topbar-right{display:flex;align-items:center;gap:8px}
.last-upd{font-size:11px;color:var(--text-faint);font-family:var(--mono);display:flex;align-items:center;gap:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#1D9E75;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12px;font-weight:500;padding:6px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover{background:#2e2c28}
.btn svg{width:13px;height:13px;flex-shrink:0}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 54px)}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.25rem}
.content{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.25rem}

/* SIDEBAR */
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding:0 8px;margin-bottom:2px}
.flt{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);font-family:var(--font);font-size:12px;font-weight:400;cursor:pointer;transition:all .12s;text-align:left;width:100%}
.flt:hover{background:var(--bg);color:var(--text)}
.flt.on{background:var(--bg);color:var(--text);font-weight:500}
.flt .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.flt .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0}
.flt .cnt{margin-left:auto;font-size:10px;color:var(--text-faint);font-family:var(--mono)}

.range-group{display:flex;flex-direction:column;gap:3px}

/* SECTION */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem}
.sec-title{font-size:12px;font-weight:600;letter-spacing:-.1px}
.sec-sub{font-size:11px;color:var(--text-muted)}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;box-shadow:var(--shadow)}
.kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:5px}
.kpi-val{font-size:30px;font-weight:600;letter-spacing:-1.5px;line-height:1}
.kpi-sub{font-size:11px;margin-top:3px;color:var(--text-faint)}

/* KANBAN */
.kanban-scroll{overflow-x:auto;padding-bottom:6px;margin:0 -4px;padding:0 4px 8px}
.kanban{display:flex;gap:10px;min-width:max-content}
.kcol{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:7px}
.kcol-hdr{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.kcol-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.kcol-name{font-size:11px;font-weight:600;flex:1}
.kcol-ct{font-size:10px;font-family:var(--mono);color:var(--text-faint);background:var(--bg);padding:2px 6px;border-radius:20px;border:1px solid var(--border)}
.kcards{display:flex;flex-direction:column;gap:6px;min-height:50px}

.kcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--sc,#ccc);border-radius:var(--radius);padding:.625rem .75rem;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;cursor:default}
.kcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kcard-name{font-size:11px;font-weight:500;line-height:1.35;margin-bottom:5px;color:var(--text)}
.kcard-list{font-size:10px;color:var(--text-faint);margin-bottom:5px;font-family:var(--mono)}
.kcard-footer{display:flex;align-items:center;justify-content:space-between;gap:4px}
.brand-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.kcard-avs{display:flex}
.kav{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:700;margin-left:-4px;border:1.5px solid var(--surface)}
.kav:first-child{margin-left:0}
.kempty{padding:.75rem;text-align:center;font-size:11px;color:var(--text-faint);background:var(--surface2);border-radius:var(--radius-sm);border:1px dashed var(--border)}
.kmore{font-size:10px;color:var(--text-faint);text-align:center;padding:3px;font-family:var(--mono)}

/* SUBTASK indicator */
.kcard.subtask{border-left-color:transparent;border-top:none;border-radius:0 0 var(--radius) var(--radius);margin-top:-8px;padding-top:.5rem;padding-left:1.25rem;position:relative;background:var(--surface2)}
.kcard.subtask::before{content:'↳';position:absolute;left:.5rem;top:.5rem;font-size:10px;color:var(--text-faint)}
.kcard-parent-wrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:0}
.kcard-parent-wrap .kcard{border-radius:0;border:none;border-left:3px solid var(--sc,#ccc);box-shadow:none;margin-bottom:0}
.kcard-parent-wrap .kcard.subtask{border-left:3px solid transparent;border-top:1px dashed var(--border)}

/* PRIORITY badge */
.prio{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.prio.urgent{background:#FEEEEE;color:#C93333}
.prio.high{background:#FFF3E0;color:#C07000}

/* BRAND BREAKDOWN */
.brand-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem .875rem;box-shadow:var(--shadow)}
.bcard-hdr{display:flex;align-items:center;gap:6px;margin-bottom:.625rem}
.bcard-dot{width:9px;height:9px;border-radius:50%}
.bcard-name{font-size:12px;font-weight:600}
.bcard-pct{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1}
.bcard-ct{font-size:10px;color:var(--text-muted);margin-top:1px}
.bcard-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:.5rem;overflow:hidden}
.bcard-fill{height:100%;border-radius:2px}

/* COLLAB */
.collab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;box-shadow:var(--shadow)}
.ccard-hdr{display:flex;align-items:center;gap:9px;margin-bottom:.875rem}
.cav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.cname{font-size:13px;font-weight:600}
.ctasks{font-size:10px;color:var(--text-muted)}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-lbl{font-size:10px;color:var(--text-muted);width:52px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-pct{font-size:10px;color:var(--text-faint);width:30px;text-align:right;font-family:var(--mono);flex-shrink:0}

/* TASK TABLE */
.ttable{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.trow{display:grid;grid-template-columns:2fr 90px 110px 80px 80px;padding:9px 14px;border-bottom:1px solid var(--border);align-items:center;gap:8px;transition:background .1s}
.trow.hdr{background:var(--bg);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);border-bottom:1px solid var(--border-strong)}
.trow:last-child{border-bottom:none}
.trow:not(.hdr):hover{background:var(--surface2)}
.trow.subtask-row{background:var(--surface2);padding-left:2rem}
.trow.subtask-row:hover{background:#EEECEA}
.tname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.tname .sub-arrow{color:var(--text-faint);font-size:11px;flex-shrink:0}
.spill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.spill .dot{width:5px;height:5px;border-radius:50%}
.tdate{font-family:var(--mono);font-size:10px;color:var(--text-faint)}
.tavs{display:flex}
.tav{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:700;margin-left:-4px;border:1.5px solid var(--surface)}
.tav:first-child{margin-left:0}

/* PRINT */
@media print{
  .topbar .btn,.sidebar{display:none!important}
  .layout{display:block}
  .content{overflow:visible;padding:0}
  .kanban-scroll{overflow:visible}
  .kanban{flex-wrap:wrap;min-width:unset}
  .kcol{width:180px}
  body,*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

// ── STATE ──────────────────────────────────────────────────────────────
let range='ant', fBrand='Todas', fCollab='Todos', fStatus='Todos', fList='Todas';

// ── DATE HELPERS ───────────────────────────────────────────────────────
const TODAY = new Date(2026,4,25);
const DOW = (TODAY.getDay()+6)%7; // Mon=0
const MON_ACT = new Date(TODAY); MON_ACT.setDate(TODAY.getDate()-DOW);
const SUN_ACT = new Date(MON_ACT); SUN_ACT.setDate(MON_ACT.getDate()+6); SUN_ACT.setHours(23,59,59);
const MON_ANT = new Date(MON_ACT); MON_ANT.setDate(MON_ACT.getDate()-7);
const SUN_ANT = new Date(MON_ACT); SUN_ANT.setDate(MON_ACT.getDate()-1); SUN_ANT.setHours(23,59,59);
const MAYO_S = new Date(2026,4,1).getTime();
const MAYO_E = new Date(2026,4,31,23,59,59).getTime();

function fmtWeek(s,e){return `${s.getDate()} – ${e.getDate()} mayo`}
const RANGE_LABELS={
  ant:`Semana anterior (${fmtWeek(MON_ANT,SUN_ANT)})`,
  act:`Semana actual (${fmtWeek(MON_ACT,SUN_ACT)})`,
  mes:'Mayo 2026 — mes completo'
};

function normStatus(s){return STATUS_MAP[(s||'').toLowerCase()]||'PLANEANDO';}

function inR(due,s,e){
  if(!due) return false;
  return due>=s.getTime()&&due<=e.getTime();
}

function filterByRange(tasks,r){
  if(r==='ant') return tasks.filter(t=>inR(t.due,MON_ANT,SUN_ANT)||!t.due&&false);
  if(r==='act') return tasks.filter(t=>inR(t.due,MON_ACT,SUN_ACT)||!t.due&&false);
  if(r==='mes') return tasks.filter(t=>(t.due&&t.due>=MAYO_S&&t.due<=MAYO_E)||!t.due);
  return tasks;
}

// Para semana sin due_date, mostramos todas (ya que ClickUp devuelve las activas)
function filterByRangeLoose(tasks,r){
  if(r==='mes') return tasks;
  // semanas: incluir tareas con due en rango + tareas sin due que estén activas
  const withDue = filterByRange(tasks,r);
  const noDue = tasks.filter(t=>!t.due&&ACTIVE_S.includes(t.statusUI));
  // dedup
  const ids = new Set(withDue.map(t=>t.id));
  return [...withDue, ...noDue.filter(t=>!ids.has(t.id))];
}

function fmtDate(ts){
  if(!ts) return '—';
  const d=new Date(ts);
  return d.toLocaleDateString('es',{day:'2-digit',month:'2-digit'});
}

// ── HELPERS HTML ───────────────────────────────────────────────────────
function avHTML(id,size=18){
  const c=COLLABS[id]; if(!c) return '';
  return `<span class="kav" style="width:${size}px;height:${size}px;background:${c.bg};color:${c.text};font-size:${Math.round(size*.36)}px">${c.initials}</span>`;
}
function bPill(brand){
  const b=BRANDS[brand]||{}; 
  return `<span class="brand-pill" style="background:${b.bg};color:${b.text}">${brand}</span>`;
}
function sPill(s){
  const c=STATUS_C[s]||'#ccc';
  return `<span class="spill" style="background:${c}18;color:${c}"><span class="dot" style="background:${c}"></span>${s}</span>`;
}
function prioBadge(p){
  if(!p||p==='normal') return '';
  return `<span class="prio ${p}">${p==='urgent'?'urgente':'alta'}</span>`;
}

function updateCounts(){
  const base = getFiltered();
  // collabs
  const cc=document.getElementById('cc-todos');
  if(cc) cc.textContent=base.length;
  Object.entries(COLLABS).forEach(([id])=>{
    const el=document.getElementById(`cc-${id}`);
    if(el) el.textContent=base.filter(t=>t.assignees.includes(id)).length;
  });
  // brands
  const cbt=document.getElementById('cb-todas');
  if(cbt) cbt.textContent=base.length;
  Object.keys(BRANDS).forEach(b=>{
    const el=document.getElementById(`cb-${b}`);
    if(el) el.textContent=base.filter(t=>t.brand===b).length;
  });
}

// ── FILTER LOGIC ──────────────────────────────────────────────────────
function getFiltered(){
  let t=filterByRangeLoose(TASKS,range);
  if(fBrand!=='Todas') t=t.filter(x=>x.brand===fBrand);
  if(fCollab!=='Todos'){
    const cid=Object.entries(COLLABS).find(([,v])=>v.name===fCollab)?.[0];
    if(cid) t=t.filter(x=>x.assignees.includes(cid));
  }
  if(fStatus!=='Todos') t=t.filter(x=>x.statusUI===fStatus);
  if(fList!=='Todas') t=t.filter(x=>x.list===fList);
  return t;
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  document.getElementById('period-lbl').textContent=RANGE_LABELS[range];
  document.getElementById('upd-el').style.display='flex';
  document.getElementById('upd-txt').textContent=LOADED_AT;
  updateCounts();

  const tasks=getFiltered();
  const total=tasks.length;
  const hechas=tasks.filter(t=>t.statusUI==='HECHO').length;
  const validar=tasks.filter(t=>t.statusUI==='VALIDAR').length;
  const enProc=tasks.filter(t=>['REDACCIÓN','DISEÑO'].includes(t.statusUI)).length;
  const espera=tasks.filter(t=>t.statusUI==='ESPERA EXT.').length;

  const content=document.getElementById('content');
  content.innerHTML=
    renderKPIs(total,hechas,validar,enProc,espera)+
    renderKanban(tasks)+
    renderBrands()+
    renderCollabs()+
    renderTable(tasks);
}

// KPIs
function renderKPIs(total,hechas,validar,enProc,espera){
  const pct=total>0?Math.round(hechas/total*100):0;
  return `<div class="kpi-row">
    <div class="kpi"><div class="kpi-lbl">Total tareas</div><div class="kpi-val">${total}</div><div class="kpi-sub">en el período</div></div>
    <div class="kpi"><div class="kpi-lbl">En progreso</div><div class="kpi-val" style="color:#7F77DD">${enProc}</div><div class="kpi-sub" style="color:#7F77DD">diseño + redacción</div></div>
    <div class="kpi"><div class="kpi-lbl">Por validar</div><div class="kpi-val" style="color:#378ADD">${validar}</div><div class="kpi-sub" style="color:var(--text-faint)">pendientes</div></div>
    <div class="kpi"><div class="kpi-lbl">Espera externa</div><div class="kpi-val" style="color:#D85A30">${espera}</div><div class="kpi-sub" style="color:var(--text-faint)">bloqueadas</div></div>
  </div>`;
}

// KANBAN — con subtareas agrupadas bajo padre
function renderKanban(tasks){
  let cols='';
  KANBAN_ORDER.forEach(status=>{
    const colTasks=tasks.filter(t=>t.statusUI===status);
    const c=STATUS_C[status];
    let cards='';
    if(!colTasks.length){
      cards=`<div class="kempty">Sin tareas</div>`;
    } else {
      const parents=colTasks.filter(t=>!t.parent);
      const orphanSubs=colTasks.filter(t=>t.parent&&!colTasks.find(p=>p.id===t.parent));
      const renderCard=(t,isSub)=>{
        const bc=BRANDS[t.brand]||{};
        const avs=t.assignees.slice(0,3).map(id=>avHTML(id,18)).join('');
        const cls=isSub?'kcard subtask':'kcard';
        return `<div class="${cls}" style="--sc:${c}">
          <div class="kcard-name">${t.name}</div>
          <div class="kcard-list">${t.list||''}</div>
          <div class="kcard-footer">
            ${bPill(t.brand)}
            <div style="display:flex;align-items:center;gap:4px">
              ${t.priority&&t.priority!=='normal'?prioBadge(t.priority):''}
              ${t.due?`<span style="font-size:9px;color:var(--text-faint);font-family:var(--mono)">${fmtDate(t.due)}</span>`:''}
            </div>
            <div class="kcard-avs">${avs}</div>
          </div>
        </div>`;
      };
      const visible=parents.slice(0,7);
      visible.forEach(p=>{
        const subs=colTasks.filter(t=>t.parent===p.id);
        if(subs.length){
          cards+=`<div class="kcard-parent-wrap">${renderCard(p,false)}${subs.map(s=>renderCard(s,true)).join('')}</div>`;
        } else {
          cards+=renderCard(p,false);
        }
      });
      orphanSubs.slice(0,3).forEach(s=>{ cards+=renderCard(s,true); });
      const extra=colTasks.length-visible.length;
      if(extra>0) cards+=`<div class="kmore">+${extra} más</div>`;
    }
    cols+=`<div class="kcol">
      <div class="kcol-hdr">
        <div class="kcol-dot" style="background:${c}"></div>
        <div class="kcol-name">${status}</div>
        <div class="kcol-ct">${colTasks.length}</div>
      </div>
      <div class="kcards">${cards}</div>
    </div>`;
  });
  return `<div>
    <div class="sec-hdr"><div class="sec-title">Kanban de tareas</div><div class="sec-sub">con subtareas anidadas</div></div>
    <div class="kanban-scroll"><div class="kanban">${cols}</div></div>
  </div>`;
}

// BRAND BREAKDOWN
function renderBrands(){
  const all=TASKS;
  const total=all.length||1;
  const cards=Object.entries(BRANDS).map(([b,bc])=>{
    const cnt=all.filter(t=>t.brand===b).length;
    const pct=Math.round(cnt/total*100);
    return `<div class="bcard">
      <div class="bcard-hdr"><div class="bcard-dot" style="background:${bc.dot}"></div><div class="bcard-name">${b}</div></div>
      <div class="bcard-pct" style="color:${bc.dot}">${pct}%</div>
      <div class="bcard-ct">${cnt} tareas totales</div>
      <div class="bcard-bar"><div class="bcard-fill" style="width:${pct}%;background:${bc.fill}"></div></div>
    </div>`;
  }).join('');
  return `<div>
    <div class="sec-hdr"><div class="sec-title">Distribución por marca</div><div class="sec-sub">total de tareas activas</div></div>
    <div class="brand-cards">${cards}</div>
  </div>`;
}

// COLLAB KPIs
function renderCollabs(){
  const base=TASKS;
  const cards=Object.entries(COLLABS).map(([cid,c])=>{
    let ct=base.filter(t=>t.assignees.includes(cid));
    if(fBrand!=='Todas') ct=ct.filter(t=>t.brand===fBrand);
    const tot=ct.length;
    const bars=Object.entries(BRANDS).map(([b,bc])=>{
      const n=ct.filter(t=>t.brand===b).length;
      if(!n) return '';
      const p=tot>0?Math.round(n/tot*100):0;
      return `<div class="bar-row">
        <span class="bar-lbl">${b}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${bc.fill}"></div></div>
        <span class="bar-pct">${p}%</span>
      </div>`;
    }).join('');
    return `<div class="ccard">
      <div class="ccard-hdr">
        <div class="cav" style="background:${c.bg};color:${c.text}">${c.initials}</div>
        <div><div class="cname">${c.name}</div><div class="ctasks">${tot} tareas asignadas</div></div>
      </div>
      ${bars||'<div style="font-size:11px;color:var(--text-faint)">Sin tareas</div>'}
    </div>`;
  }).join('');
  return `<div>
    <div class="sec-hdr"><div class="sec-title">Dedicación por colaborador</div><div class="sec-sub">% por marca</div></div>
    <div class="collab-grid">${cards}</div>
  </div>`;
}

// TASK TABLE con subtareas
function renderTable(tasks){
  if(!tasks.length) return `<div class="ttable"><div style="padding:2rem;text-align:center;color:var(--text-faint);font-size:12px">Sin tareas para los filtros seleccionados.</div></div>`;
  const parents=tasks.filter(t=>!t.parent);
  const orphans=tasks.filter(t=>t.parent&&!tasks.find(p=>p.id===t.parent));
  let rows='';
  const renderRow=(t,isSub)=>{
    const bc=BRANDS[t.brand]||{};
    const avs=t.assignees.slice(0,3).map(id=>{
      const c=COLLABS[id];return c?`<span class="tav" style="background:${c.bg};color:${c.text};font-size:6px">${c.initials}</span>`:''
    }).join('');
    const cls=isSub?'trow subtask-row':'trow';
    return `<div class="${cls}">
      <div class="tname">${isSub?'<span class="sub-arrow">↳</span>':''}${t.name}${t.priority&&t.priority!=='normal'?' '+prioBadge(t.priority):''}</div>
      <div>${bPill(t.brand)}</div>
      <div>${sPill(t.statusUI)}</div>
      <div class="tavs">${avs}</div>
      <div class="tdate">${fmtDate(t.due)}</div>
    </div>`;
  };
  parents.forEach(p=>{
    rows+=renderRow(p,false);
    tasks.filter(t=>t.parent===p.id).forEach(s=>{ rows+=renderRow(s,true); });
  });
  orphans.forEach(s=>{ rows+=renderRow(s,true); });
  return `<div>
    <div class="sec-hdr"><div class="sec-title">Listado de tareas</div><div class="sec-sub">${tasks.length} tareas</div></div>
    <div class="ttable">
      <div class="trow hdr"><div>Tarea</div><div>Marca</div><div>Estado</div><div>Equipo</div><div>Vence</div></div>
      ${rows}
    </div>
  </div>`;
}

// ── CONTROLS ──────────────────────────────────────────────────────────
window.setRange=function(r,el){
  range=r;
  document.querySelectorAll('.range-group .flt').forEach(b=>b.classList.remove('on'));
  if(el) el.classList.add('on');
  render();
};
window.setF=function(type,val,el){
  if(type==='collab') fCollab=val;
  if(type==='brand')  fBrand=val;
  if(type==='status') fStatus=val;
  if(type==='list')   fList=val;
  el.closest('.filter-group').querySelectorAll('.flt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
};

// ── INIT ──────────────────────────────────────────────────────────────
buildSidebar();
render();
